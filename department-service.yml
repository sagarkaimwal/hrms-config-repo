server:
  port: 8082
spring:
  application:
    name: department-service

  datasource:
    url: jdbc:mysql://localhost:3306/department_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format-sql: true

eureka:
  client:
    service-url:
      defaultZone:  http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: "*"
